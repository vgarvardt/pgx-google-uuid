---
rules:
  unpinned-uses:
    config:
      policies:
        # Action versions are managed by Dependabot.
        actions/checkout: ref-pin
        actions/setup-go: ref-pin
        arduino/setup-task: ref-pin
        codecov/codecov-action: ref-pin
        golangci/golangci-lint-action: ref-pin
        super-linter/super-linter: ref-pin
  self-repository:
    # Local actions run from the checkout.
    ignore:
      - lint.yml
      - testing.yml
