---
name: "Lint"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # `super-linter` reports the outcome of every linter as a commit status
      statuses: write
      # `golangci-lint-action` needs it to fetch the diff for `only-new-issues`
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        background: true
        uses: super-linter/super-linter@v9
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          # Go is linted separately.
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_JSCPD: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_SPELL_CODESPELL: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true

      - name: Lint Makefile
        background: true
        run: >-
          go run github.com/checkmake/checkmake/cmd/checkmake@v0.3.2
          --config .github/linters/checkmake.ini Makefile

      - name: Setup dependencies
        background: true
        uses: ./.github/actions/setup-deps

      - name: Wait for background steps
        wait-all:

      - name: Lint Golang
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          args: >
            --config=./.github/linters/.golangci.yml
